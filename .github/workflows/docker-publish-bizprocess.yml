name: Build and Push BizProcess Agent

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: solasticeaistudio/solstice-agentbeats

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push BizProcess Agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.bizprocess
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:bizprocess-v4
          platforms: linux/amd64

      - name: Make BizProcess image public
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/solstice-agentbeats" \
            -d '{"visibility":"public"}' || true
