name: Build and Push Finance Agent

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: solasticeaistudio/solstice-agentbeats

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Finance Agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.finance
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:finance-v7
          platforms: linux/amd64

      - name: Smoke test — start container and curl agent card
        run: |
          docker run -d --name finance-test \
            -p 9009:9009 \
            -e GOOGLE_API_KEY=test \
            -e PYTHONUNBUFFERED=1 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:finance-v7
          echo "=== Waiting 15s for server to start ==="
          sleep 15
          echo "=== Container logs ==="
          docker logs finance-test
          echo "=== Curl agent card ==="
          curl -sf http://localhost:9009/.well-known/agent.json || echo "CURL FAILED"
          docker stop finance-test || true

      - name: Smoke test 2 — shared network_mode (simulates amber competition setup)
        run: |
          python3 - << 'PYEOF'
          import yaml, json
          compose = {
            "services": {
              "purple-net": {
                "image": "alpine",
                "command": "sleep infinity",
                "ports": ["19009:9009"],
                "networks": {"testnet": {}}
              },
              "purple": {
                "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:finance-v7",
                "network_mode": "service:purple-net",
                "environment": {
                  "GOOGLE_API_KEY": "test",
                  "PYTHONUNBUFFERED": "1",
                  "OTEL_TRACES_SAMPLER": "always_on",
                  "OTEL_EXPORTER_OTLP_PROTOCOL": "http/protobuf",
                  "OTEL_EXPORTER_OTLP_ENDPOINT": "http://amber-otelcol:4318",
                  "AMBER_COMPONENT_MONIKER": "/"
                }
              }
            },
            "networks": {"testnet": {}}
          }
          with open("/tmp/test-compose.yml", "w") as f:
              yaml.dump(compose, f, default_flow_style=False)
          print("Compose file written")
          PYEOF
          cat /tmp/test-compose.yml
          docker compose -f /tmp/test-compose.yml up -d
          echo "=== Waiting 20s ==="
          sleep 20
          echo "=== Purple agent logs ==="
          docker compose -f /tmp/test-compose.yml logs purple
          echo "=== Curl from HOST via sidecar port-mapping ==="
          curl -sf http://localhost:19009/.well-known/agent.json && echo "SUCCESS - server IS in sidecar namespace" || echo "FAILED - server NOT in sidecar namespace"
          echo "=== Network namespace check (compare IPs) ==="
          NETID=$(docker compose -f /tmp/test-compose.yml ps -q purple-net)
          APPID=$(docker compose -f /tmp/test-compose.yml ps -q purple)
          echo "Sidecar IP:"; docker exec $NETID sh -c "ip addr show eth0 2>/dev/null | grep 'inet '" || true
          echo "App container IP:"; docker inspect $APPID | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['NetworkSettings']['IPAddress'])" || true
          docker compose -f /tmp/test-compose.yml down

      - name: Make Finance image public
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/solstice-agentbeats" \
            -d '{"visibility":"public"}' || true
