name: Build and Push Finance Agent

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: solasticeaistudio/solstice-agentbeats

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Finance Agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.finance
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:finance-v6
          platforms: linux/amd64

      - name: Smoke test — start container and curl agent card
        run: |
          docker run -d --name finance-test \
            -p 9009:9009 \
            -e GOOGLE_API_KEY=test \
            -e PYTHONUNBUFFERED=1 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:finance-v6
          echo "=== Waiting 15s for server to start ==="
          sleep 15
          echo "=== Container logs ==="
          docker logs finance-test
          echo "=== Curl agent card ==="
          curl -sf http://localhost:9009/.well-known/agent.json || echo "CURL FAILED"
          docker stop finance-test || true

      - name: Make Finance image public
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/solstice-agentbeats" \
            -d '{"visibility":"public"}' || true
